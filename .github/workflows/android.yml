# Builds the JJptt Android app (mobile/) and puts the APK on the
# "android-latest" release, so it can be downloaded straight to a phone.
name: Android app

on:
  push:
    branches: [mobile]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest  # comes with the Android SDK (ANDROID_HOME)
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Test and build the pages
        run: |
          npm ci
          npm test
          npm run build

      - name: Copy the pages into the app
        working-directory: mobile
        run: |
          npm ci
          node build.js
          npx cap sync android

      # a release build, signed with JJptt's own key (Secrets), rotated from
      # the old public debug key so phones update in place (sign-release.sh)
      - name: Build and sign the APK
        working-directory: mobile/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          JJPTT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          JJPTT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          chmod +x gradlew sign-release.sh
          ./gradlew assembleRelease --no-daemon
          export JJPTT_KEYSTORE="$RUNNER_TEMP/jjptt-release.p12"
          echo "$KEYSTORE_B64" | base64 -d > "$JJPTT_KEYSTORE"
          ./sign-release.sh app/build/outputs/apk/release/app-release-unsigned.apk "$GITHUB_WORKSPACE/JJptt.apk"
          rm -f "$JJPTT_KEYSTORE"
          # what the app reads to know whether it is the newest build
          echo "{\"run\": ${GITHUB_RUN_NUMBER}, \"sha\": \"${GITHUB_SHA::7}\"}" > "$GITHUB_WORKSPACE/version.json"

      - name: Publish to the android-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="0.0.${GITHUB_RUN_NUMBER}"
          git tag -f android-latest
          git push -f origin android-latest
          NOTES="JJptt Android 測試版 ${VERSION}（${GITHUB_SHA::7}）

          在手機上點下面的 JJptt.apk 下載，打開安裝（第一次要允許「安裝不明來源的應用程式」）。新版直接裝在舊版上面，設定會保留。"
          if gh release view android-latest >/dev/null 2>&1; then
            gh release edit android-latest --title "JJptt Android 測試版 ${VERSION}" --notes "$NOTES" --prerelease
            gh release upload android-latest JJptt.apk version.json --clobber
          else
            gh release create android-latest JJptt.apk version.json --title "JJptt Android 測試版 ${VERSION}" --notes "$NOTES" --prerelease
          fi
